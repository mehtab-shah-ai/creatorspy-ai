[project]
name = "creatorspy-api"
version = "0.1.0"
description = "FastAPI backend for CreatorSpy AI running on Cloudflare Workers"
dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
