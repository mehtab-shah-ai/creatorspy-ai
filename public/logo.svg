<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="clarifyGrad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="clarifyGradDark" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="clarifyGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background rounded square with subtle gradient border -->
  <rect x="1" y="1" width="38" height="38" rx="11" fill="#1A1715" stroke="url(#clarifyGrad)" stroke-width="1.2" stroke-opacity="0.4"/>
  <!-- Inner glow ring -->
  <circle cx="20" cy="20" r="14" fill="none" stroke="url(#clarifyGrad)" stroke-width="0.6" stroke-opacity="0.2"/>
  <!-- Main mark: a stylized "lens" representing clarity + insight -->
  <!-- Outer lens ring -->
  <circle cx="18" cy="18" r="9" fill="none" stroke="url(#clarifyGrad)" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Inner highlight arc -->
  <path d="M 12 18 A 6 6 0 0 1 24 18" fill="none" stroke="url(#clarifyGradDark)" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  <!-- Lens handle -->
  <line x1="24.5" y1="24.5" x2="29.5" y2="29.5" stroke="url(#clarifyGrad)" stroke-width="2.6" stroke-linecap="round"/>
  <!-- Sparkle — represents the "aha" moment of insight -->
  <path d="M 30 8 L 31.2 11 L 34 12.2 L 31.2 13.4 L 30 16 L 28.8 13.4 L 26 12.2 L 28.8 11 Z" fill="url(#clarifyGradDark)" filter="url(#clarifyGlow)"/>
  <!-- Center dot — the focused insight -->
  <circle cx="18" cy="18" r="1.8" fill="url(#clarifyGradDark)"/>
</svg>
