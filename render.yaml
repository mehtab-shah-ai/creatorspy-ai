services:
  # 1. FastAPI Backend Service
  - type: web
    name: creatorspy-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: WEB_CONCURRENCY
        value: 4
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEY_FALLBACK
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # 2. Next.js Static Frontend Site (0ms Cold Start, Never Sleeps, 100% Free Forever)
  - type: web
    name: creatorspy-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/out
    envVars:
      - key: NEXT_PUBLIC_BACKEND_URL
        value: https://creatorspy-backend.onrender.com
